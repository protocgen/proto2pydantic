name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate subject hashes
        id: hash
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          hashes=$(echo -E "$ARTIFACTS" | jq -r '.[] | select(.type == "Archive" or .type == "Checksum") | .path' | xargs sha256sum | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

  provenance:
    needs: goreleaser
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true

  buf-plugin:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          github_token: ${{ github.token }}

      - name: Docker build
        run: |
          docker build -t "plugins.buf.build/protocgen/proto2pydantic:${GITHUB_REF_NAME#v}" .

      - name: Push to BSR
        if: env.BUF_TOKEN != ''
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          echo "$BUF_TOKEN" | buf registry login --token-stdin
          buf beta registry plugin push \
            --visibility public \
            --image "plugins.buf.build/protocgen/proto2pydantic:${GITHUB_REF_NAME#v}"
