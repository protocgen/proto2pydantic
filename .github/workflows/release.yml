name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  buf-plugin:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Docker build
        run: |
          docker build -t plugins.buf.build/protocgen/proto2pydantic:${GITHUB_REF_NAME#v} .

      - name: Push to BSR
        if: env.BUF_TOKEN != ''
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          echo "$BUF_TOKEN" | buf registry login --token-stdin
          buf beta registry plugin push \
            --visibility public \
            --image plugins.buf.build/protocgen/proto2pydantic:${GITHUB_REF_NAME#v}
