name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o protoc-gen-proto2pydantic .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Build plugin
        run: go build -o protoc-gen-proto2pydantic .

      - name: Generate from A2A proto
        run: |
          mkdir -p testdata/output
          PATH="$(pwd):$PATH" buf generate

      - name: Verify output exists
        run: |
          test -f testdata/output/a2a_pb2_pydantic.py
          echo "Generated $(wc -l < testdata/output/a2a_pb2_pydantic.py) lines"

      - name: Validate Python syntax
        run: python3 -c "import ast; ast.parse(open('testdata/output/a2a_pb2_pydantic.py').read())"
