name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o protoc-gen-proto2pydantic .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Build plugin
        run: go build -o protoc-gen-proto2pydantic .

      - name: Generate from A2A proto
        run: |
          mkdir -p testdata/output
          PATH="$(pwd):$PATH" buf generate

      - name: Verify output exists
        run: |
          test -f testdata/output/types.py
          echo "Generated $(wc -l < testdata/output/types.py) lines"

      - name: Validate Python syntax
        run: python3 -c "import ast; ast.parse(open('testdata/output/types.py').read())"

  golden-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Build plugin
        run: go build -o protoc-gen-proto2pydantic .

      - name: Regenerate golden file
        run: |
          cd testdata/proto
          PATH="$(git rev-parse --show-toplevel):$PATH" buf generate

      - name: Compare golden file
        run: |
          if ! git diff --exit-code testdata/golden/; then
            echo "::error::Golden file mismatch! Regenerate with: cd testdata/proto && buf generate"
            exit 1
          fi
